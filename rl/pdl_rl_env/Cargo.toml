# Thin Python wrapper over the Pocket Deck Lab engine for self-play training.
# Depends on the engine by path (engine/ in this repo) and does not modify anything under engine/src/.
[package]
name = "pdl_rl_env"
version = "0.7.2"
edition = "2021"

[lib]
name = "pdl_rl_env"
crate-type = ["cdylib"]

[dependencies]
deckgym = { path = "../../engine" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
opt-level = 3
